name: Control Center CI

on:
  pull_request:
    paths:
      - "apps/control-center/**"
      - "config/control-center/**"
      - "schemas/control-center/**"
      - "module.yaml"
      - ".github/workflows/control-center-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-center/**"
      - "config/control-center/**"
      - "schemas/control-center/**"
      - "module.yaml"
      - ".github/workflows/control-center-ci.yml"

permissions:
  contents: read

concurrency:
  group: control-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validator dependencies
        run: python -m pip install -r ../../requirements-validation.txt
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Validate registries and schemas
        run: npm run validate
      - name: Run tests
        run: npm test
